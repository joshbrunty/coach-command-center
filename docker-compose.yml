name: coach-command-center

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coach_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-coach_command_center}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ["prod"]
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-coach}:${POSTGRES_PASSWORD:-coach_dev_password}@db:5432/${POSTGRES_DB:-coach_command_center}
      APP_NAMESPACE: ${APP_NAMESPACE:-coach-command-center}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    profiles: ["prod"]
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      APP_SITE_ADDRESS: ${APP_SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy

  api-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:api"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-coach}:${POSTGRES_PASSWORD:-coach_dev_password}@db:5432/${POSTGRES_DB:-coach_command_center}
      APP_NAMESPACE: ${APP_NAMESPACE:-coach-command-center}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PORT: 3000
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    ports:
      - "${API_DEV_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:web -- --host 0.0.0.0"
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      VITE_API_PROXY_TARGET: http://api-dev:3000
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    depends_on:
      - api-dev

  scoreboard-exporter:
    profiles: ["obs"]
    build:
      context: ./scoreboard-exporter
      target: dev
    restart: unless-stopped
    environment:
      SCOREBOARD_SOURCE: ${SCOREBOARD_SOURCE:-sqlite}
      SCOREBOARD_HTTP_URL: ${SCOREBOARD_HTTP_URL:-}
      SCOREBOARD_HTTP_POLL_INTERVAL_SECONDS: ${SCOREBOARD_HTTP_POLL_INTERVAL_SECONDS:-120}
      SCOREBOARD_HTTP_TIMEOUT_MS: ${SCOREBOARD_HTTP_TIMEOUT_MS:-4000}
      SCOREBOARD_SQLITE_PATH: ${SCOREBOARD_SQLITE_PATH:-/data/setup_data/scoreboard_history_setup.db}
      SCOREBOARD_SQLITE_POLL_INTERVAL_SECONDS: ${SCOREBOARD_SQLITE_POLL_INTERVAL_SECONDS:-5}
      REPLAY_RATE: ${REPLAY_RATE:-fast}
      OUR_TEAM_NAME: ${OUR_TEAM_NAME:-Team USA}
      GAME_TICK_LENGTH_SECONDS: ${GAME_TICK_LENGTH_SECONDS:-120}
      EXPORTER_PORT: 9101
    volumes:
      - ./scoreboard-exporter:/app
      - scoreboard_exporter_node_modules:/app/node_modules
      - ./grafana/setup_data:/data/setup_data:ro
    ports:
      - "${OBS_EXPORTER_PORT:-9101}:9101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9101/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    develop:
      watch:
        - path: ./scoreboard-exporter/src
          action: sync
          target: /app/src

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--web.enable-lifecycle"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${OBS_PROM_PORT:-9090}:9090"
    depends_on:
      scoreboard-exporter:
        condition: service_started
    develop:
      watch:
        - path: ./ops/prometheus/prometheus.yml
          action: sync+exec
          target: /etc/prometheus/prometheus.yml
          exec:
            command: ["wget", "-q", "-O-", "--post-data=", "http://127.0.0.1:9090/-/reload"]

  prometheus-config-reloader:
    profiles: ["obs"]
    image: alpine:3.20
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache inotify-tools curl > /dev/null
        echo "Watching /etc/prometheus/prometheus.yml for changes..."
        while inotifywait -e close_write,move,create,delete /etc/prometheus/prometheus.yml; do
          echo "Reloading Prometheus config..."
          curl -sf -X POST http://prometheus:9090/-/reload && echo " reload OK" || echo " reload FAILED"
        done
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - prometheus

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-coach-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/coach-scoreboard.json
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${OBS_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    develop:
      watch:
        - path: ./ops/grafana/dashboards
          action: sync
          target: /var/lib/grafana/dashboards
        - path: ./ops/grafana/provisioning
          action: sync
          target: /etc/grafana/provisioning

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
  scoreboard_exporter_node_modules:
  prometheus_data:
  grafana_data:
