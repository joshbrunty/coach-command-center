[server]
http_port = 3000

[security]
admin_user = admin

[users]
default_theme = dark

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/coach-scoreboard.json

[log]
mode = console
level = info
